name: Bug Report
description: Report an issue or unexpected behavior in Signage Lab Platform
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: input
    id: version
    attributes:
      label: Version / Commit SHA
      description: What version of the platform are you running?
      placeholder: e.g. v3.0.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Subsystem
      options:
        - Engine: Sequencer
        - Engine: Video Decoder / A-B Switcher
        - Engine: Storage Bridge / WebOSStorage
        - Engine: Device Shadow / MQTT
        - Console: Playlist Builder
        - Console: Template Manager / Layout Preview
        - Console: Provisioning / QR Generator
        - Console: Debug Inspector / Telemetry
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Kernel / Browser Console Logs
      description: Paste any error outputs or telemetry logs here.
      render: shell
